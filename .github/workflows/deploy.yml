name: Deploy

on:
  push:
    branches:
      - main

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The lockfile is generated with pnpm 10. Use the same major version in CI
      # so --frozen-lockfile validates the workspace configuration consistently.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Diagnose Supabase connection
        working-directory: ./lib/db
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          node <<'NODE'
          const { URL } = require('url');
          const dns = require('dns').promises;
          const { Client } = require('pg');

          (async () => {
            const u = new URL(process.env.DATABASE_URL);
            console.log(`DB host: ${u.hostname}`);
            console.log(`DB port: ${u.port || '5432'}`);
            console.log(`DB user: ${decodeURIComponent(u.username)}`);
            console.log(`Pooler host: ${u.hostname.includes('pooler.supabase.com')}`);
            console.log(`IPv4 addresses: ${(await dns.resolve4(u.hostname)).join(', ') || '(none)'}`);

            const client = new Client({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 10000, ssl: { rejectUnauthorized: false } });
            try {
              await client.connect();
              const r = await client.query('select current_database() as database, current_user as user');
              console.log(`DB connection: OK (${r.rows[0].database} / ${r.rows[0].user})`);
              await client.end();
            } catch (err) {
              console.error(`DB connection: FAILED (${err.code || 'no-code'}): ${err.message}`);
              process.exit(1);
            }
          })().catch(err => {
            console.error(`DB diagnostic: FAILED (${err.code || 'no-code'}): ${err.message}`);
            process.exit(1);
          });
          NODE

      - name: Push database schema to Supabase
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: pnpm --filter @workspace/db run push

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
