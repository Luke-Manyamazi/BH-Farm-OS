services:
  - type: web
    name: bh-farm-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bh-farm-db
          property: connectionString

databases:
  - name: bh-farm-db
    plan: free
    region: frankfurt
    databaseName: bhfarm
