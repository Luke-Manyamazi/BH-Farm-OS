services:
  - type: web
    name: bh-farm-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      # The API must use the same Supabase PostgreSQL database as local development
      # and the database-schema GitHub Actions workflow. Set this value in Render.
      - key: DATABASE_URL
        sync: false
