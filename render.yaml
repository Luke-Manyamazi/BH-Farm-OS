services:
  - type: web
    name: bh-farm-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      # Render is IPv4-only. Use the Supabase Supavisor Session Pooler URL
      # (pooler.supabase.com, port 5432), not the direct db.<project-ref>.supabase.co URL.
      # Set DATABASE_URL in the Render service environment variables.
      - key: DATABASE_URL
        sync: false
