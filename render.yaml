services:
  - type: web
    name: bh-farm-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      # Render is IPv4-only. Use the Supabase Supavisor Session Pooler URL
      # (pooler.supabase.com, port 5432), not the direct db.<project-ref>.supabase.co URL.
      - key: DATABASE_URL
        sync: false
      # Browser session cookies are accepted only from this production frontend.
      - key: FRONTEND_URL
        value: https://bh-farm-os.vercel.app
      # Set a long random secret in Render before first-time authentication bootstrap.
      - key: ADMIN_BOOTSTRAP_KEY
        sync: false
